name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (core) and Worker tests (cron, in workerd)
        run: pnpm --filter @cmc/core --filter @cmc/cron test

      - name: Seed local KV from the committed fixture
        run: pnpm --filter @cmc/cron seed

      - name: Build web
        run: pnpm --filter @cmc/web build

      - name: Install Playwright Chromium
        run: pnpm --filter @cmc/web exec playwright install --with-deps chromium

      - name: Smoke tests (web, Playwright against astro preview)
        run: pnpm --filter @cmc/web test
        env:
          ASTRO_PREVIEW_BACKGROUND: '0'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          if-no-files-found: ignore
